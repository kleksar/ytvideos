name: ytvideos-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${YTV_POSTGRES_USER:-ytvideos}
      POSTGRES_DB: ${YTV_POSTGRES_DB:-ytvideos}
      POSTGRES_PASSWORD: ${YTV_POSTGRES_PASSWORD:?Set YTV_POSTGRES_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:${YTV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
