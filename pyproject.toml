[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ytvideos"
version = "0.1.0"
description = "Resumable, channel-independent video production with explicit human gates"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<50"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
media = ["Pillow>=11,<13", "numpy>=2,<3", "scipy>=1.14,<2"]
youtube = ["google-auth>=2.38,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
ytv = "ytvideos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytvideos"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
